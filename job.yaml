resources:
  jobs:
    Pipeline_Medalhão_DataFreaks:
      name: Pipeline Medalhão - DataFreaks
      schedule:
        quartz_cron_expression: 0 0 */2 * * ?
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        - task_key: extracao_bronze
          notebook_task:
            notebook_path: notebooks/land_to_bronze
            source: GIT
        - task_key: conversao_silver
          depends_on:
            - task_key: extracao_bronze
          notebook_task:
            notebook_path: notebooks/bronze_to_silver
            source: GIT
        - task_key: transformacao_gold
          depends_on:
            - task_key: conversao_silver
          notebook_task:
            notebook_path: notebooks/silver_to_gold
            source: GIT
      git_source:
        git_url: https://github.com/ThyagoSnt/RocketLabDados-2025.2-Projeto
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
